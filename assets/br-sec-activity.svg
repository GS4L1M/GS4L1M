<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 90" width="1200" height="90" role="img" aria-label="REGISTRO DE ATIVIDADE"><defs>
  <filter id="neon" x="-30%" y="-60%" width="160%" height="220%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b1"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b2"/>
    <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="2"/>
  </filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#000" fill-opacity=".35"/>
  </pattern>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#05D9E8" stroke-opacity=".06"/>
  </pattern><linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#FF8C1A"/><stop offset="1" stop-color="#FF8C1A" stop-opacity="0"/></linearGradient></defs><rect width="1200" height="90" fill="#07030D"/><text x="48" y="54" font-family="'Arial Black','Segoe UI Black','Helvetica Neue',Arial,sans-serif" font-size="30" letter-spacing="4" fill="#D1F7FF" stroke="#FF8C1A" stroke-width=".8" filter="url(#neon)">REGISTRO DE ATIVIDADE</text><text x="1152" y="54" text-anchor="end" font-family="Consolas,'SFMono-Regular','Liberation Mono','Courier New',monospace" font-size="14" fill="#7C6A99">&gt; cat ./atividade.log</text><rect x="48" y="70" width="1104" height="2" fill="url(#ln)"/><rect x="48" y="68" width="60" height="6" fill="#FF8C1A" filter="url(#neon)"><animate attributeName="x" values="48;1092;48" dur="7s" repeatCount="indefinite"/></rect></svg>