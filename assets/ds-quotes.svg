<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 562" width="1200" height="562" role="img" aria-label="Transmissões interceptadas: Qualquer tecnologia suficientemente avançada é indistinguível de mágica. (ARTHUR C. CLARKE) / Se você acha que entende a mecânica quântica, você não entende a mecânica quântica. (RICHARD FEYNMAN) / O que observamos não é a natureza em si, mas a natureza exposta ao nosso método de questionamento. (WERNER HEISENBERG) / Só podemos ver um pouco do futuro, mas o suficiente para perceber que há muito a fazer. (ALAN TURING) / O futuro já chegou. Só não está uniformemente distribuído. (WILLIAM GIBSON) / Nem tudo que pode ser contado conta, e nem tudo que conta pode ser contado. (WILLIAM B. CAMERON)"><defs>
  <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b1"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b2"/>
    <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="1" fill="#000" fill-opacity=".35"/>
  </pattern>
  <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
    <rect width="2" height="2" fill="#00F0FF" fill-opacity=".10"/>
  </pattern></defs><rect width="1200" height="562" fill="#0A0A0F"/><rect x="36" y="20" width="552" height="150" fill="#111118"/><rect x="36" y="20" width="5" height="150" fill="#00F0FF"/><text x="60" y="48" font-family="Consolas,'SFMono-Regular','Liberation Mono','Courier New',monospace" font-size="11" letter-spacing="2" fill="#6E7191">TRANSMISSÃO #01 · SINAL <tspan fill="#00F0FF">■■■■□</tspan></text><text x="60" y="80" font-family="Consolas,'SFMono-Regular','Liberation Mono','Courier New',monospace" font-size="17" fill="#F2F2F2">“Qualquer tecnologia suficientemente avançada é</text><text x="60" y="103" font-family="Consolas,'SFMono-Regular','Liberation Mono','Courier New',monospace" font-size="17" fill="#F2F2F2">indistinguível de mágica.”</text><text x="568" y="154" text-anchor="end" font-family="'Arial Black','Segoe UI Black',Impact,'Helvetica Neue',Arial,sans-serif" font-size="13" letter-spacing="2" fill="#00F0FF">— ARTHUR C. CLARKE</text><rect x="624" y="20" width="552" height="150" fill="#111118"/><rect x="624" y="20" width="5" height="150" fill="#FF2E88"/><text x="648" y="48" font-family="Consolas,'SFMono-Regular','Liberation Mono','Courier New',monospace" font-size="11" letter-spacing="2" fill="#6E7191">TRANSMISSÃO #02 · SINAL <tspan fill="#FF2E88">■■■■□</tspan></text><text x="648" y="80" font-family="Consolas,'SFMono-Regular','Liberation Mono','Courier New',monospace" font-size="17" fill="#F2F2F2">“Se você acha que entende a mecânica quântica, você</text><text x="648" y="103" font-family="Consolas,'SFMono-Regular','Liberation Mono','Courier New',monospace" font-size="17" fill="#F2F2F2">não entende a mecânica quântica.”</text><text x="1156" y="154" text-anchor="end" font-family="'Arial Black','Segoe UI Black',Impact,'Helvetica Neue',Arial,sans-serif" font-size="13" letter-spacing="2" fill="#FF2E88">— RICHARD FEYNMAN</text><rect x="36" y="194" width="552" height="150" fill="#111118"/><rect x="36" y="194" width="5" height="150" fill="#F5E663"/><text x="60" y="222" font-family="Consolas,'SFMono-Regular','Liberation Mono','Courier New',monospace" font-size="11" letter-spacing="2" fill="#6E7191">TRANSMISSÃO #03 · SINAL <tspan fill="#F5E663">■■■■□</tspan></text><text x="60" y="254" font-family="Consolas,'SFMono-Regular','Liberation Mono','Courier New',monospace" font-size="17" fill="#F2F2F2">“O que observamos não é a natureza em si, mas a</text><text x="60" y="277" font-family="Consolas,'SFMono-Regular','Liberation Mono','Courier New',monospace" font-size="17" fill="#F2F2F2">natureza exposta ao nosso método de questionamento.”</text><text x="568" y="328" text-anchor="end" font-family="'Arial Black','Segoe UI Black',Impact,'Helvetica Neue',Arial,sans-serif" font-size="13" letter-spacing="2" fill="#F5E663">— WERNER HEISENBERG</text><rect x="624" y="194" width="552" height="150" fill="#111118"/><rect x="624" y="194" width="5" height="150" fill="#00F0FF"/><text x="648" y="222" font-family="Consolas,'SFMono-Regular','Liberation Mono','Courier New',monospace" font-size="11" letter-spacing="2" fill="#6E7191">TRANSMISSÃO #04 · SINAL <tspan fill="#00F0FF">■■■■□</tspan></text><text x="648" y="254" font-family="Consolas,'SFMono-Regular','Liberation Mono','Courier New',monospace" font-size="17" fill="#F2F2F2">“Só podemos ver um pouco do futuro, mas o suficiente</text><text x="648" y="277" font-family="Consolas,'SFMono-Regular','Liberation Mono','Courier New',monospace" font-size="17" fill="#F2F2F2">para perceber que há muito a fazer.”</text><text x="1156" y="328" text-anchor="end" font-family="'Arial Black','Segoe UI Black',Impact,'Helvetica Neue',Arial,sans-serif" font-size="13" letter-spacing="2" fill="#00F0FF">— ALAN TURING</text><rect x="36" y="368" width="552" height="150" fill="#111118"/><rect x="36" y="368" width="5" height="150" fill="#FF2E88"/><text x="60" y="396" font-family="Consolas,'SFMono-Regular','Liberation Mono','Courier New',monospace" font-size="11" letter-spacing="2" fill="#6E7191">TRANSMISSÃO #05 · SINAL <tspan fill="#FF2E88">■■■■□</tspan></text><text x="60" y="428" font-family="Consolas,'SFMono-Regular','Liberation Mono','Courier New',monospace" font-size="17" fill="#F2F2F2">“O futuro já chegou. Só não está uniformemente</text><text x="60" y="451" font-family="Consolas,'SFMono-Regular','Liberation Mono','Courier New',monospace" font-size="17" fill="#F2F2F2">distribuído.”</text><text x="568" y="502" text-anchor="end" font-family="'Arial Black','Segoe UI Black',Impact,'Helvetica Neue',Arial,sans-serif" font-size="13" letter-spacing="2" fill="#FF2E88">— WILLIAM GIBSON</text><rect x="624" y="368" width="552" height="150" fill="#111118"/><rect x="624" y="368" width="5" height="150" fill="#F5E663"/><text x="648" y="396" font-family="Consolas,'SFMono-Regular','Liberation Mono','Courier New',monospace" font-size="11" letter-spacing="2" fill="#6E7191">TRANSMISSÃO #06 · SINAL <tspan fill="#F5E663">■■■■□</tspan></text><text x="648" y="428" font-family="Consolas,'SFMono-Regular','Liberation Mono','Courier New',monospace" font-size="17" fill="#F2F2F2">“Nem tudo que pode ser contado conta, e nem tudo que</text><text x="648" y="451" font-family="Consolas,'SFMono-Regular','Liberation Mono','Courier New',monospace" font-size="17" fill="#F2F2F2">conta pode ser contado.”</text><text x="1156" y="502" text-anchor="end" font-family="'Arial Black','Segoe UI Black',Impact,'Helvetica Neue',Arial,sans-serif" font-size="13" letter-spacing="2" fill="#F5E663">— WILLIAM B. CAMERON</text><rect x="762" y="24" width="102" height="9" fill="#FF2E88" opacity="0"><animate attributeName="opacity" values="0;0;.55;0;0" keyTimes="0;0.16;0.17;0.19;1" dur="7.0s" repeatCount="indefinite"/></rect><rect x="698" y="122" width="157" height="9" fill="#FF2E88" opacity="0"><animate attributeName="opacity" values="0;0;.55;0;0" keyTimes="0;0.22;0.23;0.25;1" dur="7.7s" repeatCount="indefinite"/></rect><rect x="738" y="362" width="409" height="4" fill="#FF2E88" opacity="0"><animate attributeName="opacity" values="0;0;.55;0;0" keyTimes="0;0.38;0.39;0.41;1" dur="8.4s" repeatCount="indefinite"/></rect><rect x="323" y="170" width="352" height="3" fill="#FF2E88" opacity="0"><animate attributeName="opacity" values="0;0;.55;0;0" keyTimes="0;0.31;0.32;0.34;1" dur="9.1s" repeatCount="indefinite"/></rect><rect width="1200" height="562" fill="url(#scan)"/></svg>