<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Projeto ANÁLISE ANP: Dashboard dos preços de combustíveis da ANP: gasolina, diesel e etanol por estado, município, bairro e bandeira."><defs>
  <filter id="neon" x="-30%" y="-60%" width="160%" height="220%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b1"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b2"/>
    <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="2"/>
  </filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#000" fill-opacity=".35"/>
  </pattern>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#05D9E8" stroke-opacity=".06"/>
  </pattern></defs><rect width="400" height="300" fill="#07030D"/><rect x="8" y="8" width="384" height="284" fill="#0B0614" stroke="#FF8C1A" stroke-opacity=".5"/><path d="M8 24V8H24" fill="none" stroke="#FF8C1A" stroke-width="2.5"/><path d="M392 24V8H376" fill="none" stroke="#FF8C1A" stroke-width="2.5"/><path d="M8 276V292H24" fill="none" stroke="#FF8C1A" stroke-width="2.5"/><path d="M392 276V292H376" fill="none" stroke="#FF8C1A" stroke-width="2.5"/><text x="26" y="40" font-family="Consolas,'SFMono-Regular','Liberation Mono','Courier New',monospace" font-size="12" letter-spacing="3" fill="#7C6A99">ARQUIVO DE CASO #02</text><text x="374" y="42" text-anchor="end" font-family="'Yu Gothic','Hiragino Kaku Gothic Pro',Meiryo,'MS Gothic','Noto Sans CJK JP',sans-serif" font-size="16" fill="#FF8C1A" filter="url(#neon)">燃料<animate attributeName="opacity" values="1;1;.25;1;.7;1;1;.4;1" keyTimes="0;.62;.64;.66;.7;.72;.9;.92;1" dur="7s" begin="1.4s" repeatCount="indefinite"/></text><text x="26" y="82" font-family="'Arial Black','Segoe UI Black','Helvetica Neue',Arial,sans-serif" font-size="25" fill="#D1F7FF" stroke="#FF8C1A" stroke-width=".6" filter="url(#neon)">ANÁLISE ANP</text><line x1="26" y1="98" x2="374" y2="98" stroke="#FF8C1A" stroke-opacity=".4"/><text x="26" y="126" font-family="Consolas,'SFMono-Regular','Liberation Mono','Courier New',monospace" font-size="14" fill="#D1F7FF" fill-opacity=".85">Dashboard dos preços de combustíveis da</text><text x="26" y="147" font-family="Consolas,'SFMono-Regular','Liberation Mono','Courier New',monospace" font-size="14" fill="#D1F7FF" fill-opacity=".85">ANP: gasolina, diesel e etanol por</text><text x="26" y="168" font-family="Consolas,'SFMono-Regular','Liberation Mono','Courier New',monospace" font-size="14" fill="#D1F7FF" fill-opacity=".85">estado, município, bairro e bandeira.</text><rect x="26" y="222" width="66" height="22" fill="#FF8C1A" fill-opacity=".1" stroke="#FF8C1A" stroke-opacity=".6"/><text x="59.0" y="237" text-anchor="middle" font-family="Consolas,'SFMono-Regular','Liberation Mono','Courier New',monospace" font-size="12" fill="#FF8C1A">Python</text><rect x="100" y="222" width="66" height="22" fill="#FF8C1A" fill-opacity=".1" stroke="#FF8C1A" stroke-opacity=".6"/><text x="133.0" y="237" text-anchor="middle" font-family="Consolas,'SFMono-Regular','Liberation Mono','Courier New',monospace" font-size="12" fill="#FF8C1A">Pandas</text><rect x="174" y="222" width="90" height="22" fill="#FF8C1A" fill-opacity=".1" stroke="#FF8C1A" stroke-opacity=".6"/><text x="219.0" y="237" text-anchor="middle" font-family="Consolas,'SFMono-Regular','Liberation Mono','Courier New',monospace" font-size="12" fill="#FF8C1A">Streamlit</text><text x="26" y="274" font-family="Consolas,'SFMono-Regular','Liberation Mono','Courier New',monospace" font-size="13" fill="#FF8C1A">&gt; ACESSAR ARQUIVO<tspan>_<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" calcMode="discrete"/></tspan></text><rect width="400" height="300" fill="url(#scan)"/></svg>